# Training configuration shared by baseline and proposed training entrypoints.
seeds: [42, 123, 2024, 2026, 3407]
primary_seed: 42

early_stopping:
  metric: val_auprc
  mode: max
  patience: 6

checkpoint:
  dir: experiments/checkpoints
  save_best: true

logging:
  dir: experiments/logs
  use_mlflow: false        # MLflow optional; local JSON registry always written
  log_every: 50

evaluation:
  threshold_selection: val   # thresholds chosen on validation, never test
  rca_top_k: [1, 3, 5]
  bootstrap_samples: 1000
